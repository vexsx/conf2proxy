services:
  conf2proxy:
    build:
      context: .
      args:
        V2RAY_VERSION: "5.49.0"
    image: vexsx/conf2proxy:v4
    container_name: conf2proxy
    restart: unless-stopped

    # Default is safe: expose the selected local proxy only on localhost.
    # Change 127.0.0.1 to 0.0.0.0 only when you intentionally want LAN access.
    # LOCAL_PROXY_PROTOCOL controls what listens on PROXY_PORT:
    #   socks5 -> SOCKS5 proxy on PROXY_PORT
    #   http   -> HTTP proxy on PROXY_PORT
    #   both   -> SOCKS5 on SOCKS_PORT and HTTP on HTTP_PORT
    ports:
      - "127.0.0.1:${HOST_PROXY_PORT:-1080}:${PROXY_PORT:-1080}/tcp"
      # Enable this only when LOCAL_PROXY_PROTOCOL=both:
      # - "127.0.0.1:${HOST_HTTP_PORT:-1081}:${HTTP_PORT:-1081}/tcp"

    environment:
      TZ: "Asia/Tehran"
      LOGLEVEL: "warning"

      # Choose the local proxy exposed by this container: socks5, http, or both.
      LOCAL_PROXY_PROTOCOL: "socks5"
      INBOUND_LISTEN: "0.0.0.0"
      PROXY_PORT: "1080"

      # Used only when LOCAL_PROXY_PROTOCOL=both.
      SOCKS_PORT: "1080"
      HTTP_PORT: "1081"

      ENABLE_SOCKS_UDP: "true"
      ENABLE_SNIFFING: "true"
      ROUTE_PRIVATE_DIRECT: "true"
      ENABLE_MUX: "false"
      MUX_CONCURRENCY: "8"

      # Optional auth. Strongly recommended for LAN/public exposure.
      # PROXY_AUTH: "password"
      # PROXY_USER: "proxyuser"
      # PROXY_PASS: "change-me"

      # Optional direct link input. If set, it has priority over mounted files.
      # V2RAY_LINK: "vless://..."

    volumes:
      - ./v2ray:/etc/v2ray:ro

    read_only: true
    tmpfs:
      - /work:size=16m,mode=0700,uid=10001,gid=10001
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - |
          import os, socket
          proto = os.environ.get('LOCAL_PROXY_PROTOCOL', 'socks5').lower()
          if proto == 'http':
              port = int(os.environ.get('PROXY_PORT') or os.environ.get('HTTP_PORT') or '1080')
          elif proto == 'both':
              port = int(os.environ.get('SOCKS_PORT') or '1080')
          else:
              port = int(os.environ.get('PROXY_PORT') or os.environ.get('SOCKS_PORT') or '1080')
          s = socket.create_connection(('127.0.0.1', port), 3)
          s.close()
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
